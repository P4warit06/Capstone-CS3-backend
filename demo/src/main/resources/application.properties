spring.application.name=Capstone PlanIT

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/planit_for_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=org.postgresql.Driver

# Development
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
azure.client-id=${AZURE_CLIENT_ID:0aad8129-c6e4-4222-b49d-e9eadd0fe4a8}